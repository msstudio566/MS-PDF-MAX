name: Build MS PDF MAX APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Show project files
    run: |
      echo "Repository files:"
      find . -maxdepth 3 -type f | head -100

  - name: Find Android project
    run: |
      find . -type f -name "settings.gradle" -o -name "settings.gradle.kts"
