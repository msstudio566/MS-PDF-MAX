name: Build MS PDF MAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          find . -maxdepth 3 -type f -name "*.zip"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o MS_PDF_MAX_Android_Project.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd extracted
          PROJECT_DIR=$(find . -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-MAX-APK
          path: extracted/**/*.apk
