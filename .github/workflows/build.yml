name: Build MS PDF MAX APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Show project files
    run: |
      echo "Repository files:"
      ls -la
      echo "ZIP files:"
      find . -maxdepth 2 -type f -name "*.zip"
