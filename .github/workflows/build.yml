name: Build MS PDF MAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Project ki files check karna aur zip ho toh unzip karna
      - name: Show and Extract project files
        run: |
          echo "=== Repository Content ==="
          ls -la
          
          # Agar koi zip file milti hai toh use unzip karega
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ ! -z "$ZIP_FILE" ]; then
            echo "Zip file mili: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d .
            echo "=== Content after extraction ==="
            ls -la
          fi

      # 2. Java Setup (Bina gradle cache ke, taaki crash na ho)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. Gradle permissions dena
      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew || true
          chmod +x android/gradlew || true
          find . -name "gradlew" -exec chmod +x {} \;

      # 4. APK Build Process
      - name: Build Android Release APK
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ ! -z "$GRADLE_PATH" ]; then
            echo "Gradlew yahan mila: $GRADLE_PATH"
            cd $(dirname "$GRADLE_PATH")
            ./gradlew assembleRelease
          else
            echo "Error: Poore project me kahin bhi 'gradlew' file nahi mili."
            echo "Kripya check karein ki kya aapne sahi Android source code upload kiya hai."
            exit 1
          fi

      # 5. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-MAX-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
