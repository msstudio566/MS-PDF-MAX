name: Build MS PDF MAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Repository files:"
          ls -la
          echo "ZIP files:"
          find . -maxdepth 2 -type f -name "*.zip"

      # 1. Java Setup (Android build ke liye zaroori hai)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      # 2. Gradle ko run karne ki permission dena
      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew || true
          chmod +x android/gradlew || true

      # 3. APK Build Process (Yeh direct root ya android folder dono ko check karega)
      - name: Build Android Release APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          elif [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android && ./gradlew assembleRelease
          else
            echo "Error: gradlew file nahi mili. Kripya check karein ki aapka Android project folder sahi hai ya nahi."
            exit 1
          fi

      # 4. Tayaar APK ko Artifacts me upload karna (Jahan se aap download kar sakein)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-MAX-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
