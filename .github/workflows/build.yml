name: Build MS PDF MAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted

      - name: Build Android APK
        run: |
          SETTINGS=$(find extracted -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-PDF-MAX-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
